name: Temporal input pipeline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cmake -S . -B core-build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build core-build --config Release --parallel
      - run: ctest --test-dir core-build -C Release --output-on-failure
      - name: Independent rational reference
        if: runner.os == 'Linux'
        run: python3 Verification/run_reference_checks.py --output-directory ../reference-results

  native-sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cmake -S . -B core-sanitize -DCMAKE_BUILD_TYPE=Debug -DRIP_ENABLE_SANITIZERS=ON
      - run: cmake --build core-sanitize --parallel
      - run: ctest --test-dir core-sanitize --output-on-failure

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - run: swift test --scratch-path .build-tsan --sanitize=thread -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - run: swift build -c release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Replay canonical fixture twice
        shell: bash
        run: |
          executable="$(swift build -c release --show-bin-path)/input-pipeline"
          "$executable" replay Fixtures/reference.json --deterministic-output result-1.json
          "$executable" replay Fixtures/reference.json --deterministic-output result-2.json
          cmake -E compare_files result-1.json result-2.json
          cmake -E compare_files result-1.json Fixtures/reference.expected.json
